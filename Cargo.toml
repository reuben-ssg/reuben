[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reuben-ssg/reuben"

[workspace.dependencies]
reuben-core = { path = "crates/reuben-core", version = "0.3.0" }
reuben-a11y = { path = "crates/reuben-a11y", version = "0.3.0" }
html5ever = "0.40"
comrak = { version = "0.59", default-features = false }
pulldown-latex = "0.8"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "default-themes", "html", "parsing", "plist-load", "regex-fancy"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde-saphyr = "2.1"
rhai = { version = "1.27", features = ["sync", "serde"] }
toml = "1.2"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2.0"
walkdir = "2.5"
rayon = "1.12"
libc = { version = "0.2.150", default-features = false }
glob = "0.3"
xxhash-rust = { version = "=0.8.15", features = ["xxh3"] }
lightningcss = { version = "1.0.0-alpha.72", default-features = false, features = ["browserslist", "bundler", "visitor"] }
elsa = "1.11"
tiny_http = "0.12"
notify = "8"
jiff = "0.2"
insta = "1.49"
criterion = { version = "0.8", default-features = false }
assert_cmd = "2.2"
assert_fs = "1.1"
predicates = "3.1"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
