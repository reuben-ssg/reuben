name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo publish --workspace --dry-run

  # Builds and tests on the declared rust-version, so a dependency that needs a newer
  # toolchain fails here instead of in users' `cargo install`.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked

  # The only check the main ruleset requires: it passes only when every job in `needs` passed.
  # `always()` makes it run, and fail, when a needed job fails; a skipped required check would count as passing.
  # Add every new job to `needs`.
  ci-ok:
    if: always()
    needs: [check, msrv]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            [ "$result" = success ] || exit 1
          done
