# Publishes the npm installer package that dist built and attached to the GitHub Release.
# It runs after a successful tag-push run of the generated Release workflow and waits for
# approval in the `release` environment before publishing.
name: Publish npm

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

jobs:
  publish-npm:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event.workflow_run.head_branch }}
      TARBALL: reuben-npm-package.tar.gz
    steps:
      - name: Download the npm package from the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$TARBALL"

      - name: Check the package matches the tag
        run: |
          name=$(tar -xzOf "$TARBALL" package/package.json | jq -r .name)
          version=$(tar -xzOf "$TARBALL" package/package.json | jq -r .version)
          if [ "$name" != "@reuben-ssg/reuben" ] || [ "v$version" != "$TAG" ]; then
            echo "::error::package is $name@$version, expected @reuben-ssg/reuben@${TAG#v}"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5 or newer.
      - name: Update npm
        run: npm install -g npm@^11.5

      # Stage 1 publishes with the NPM_TOKEN secret; stage 2 uses trusted publishing (OIDC)
      # with no secret. setup-node always writes an _authToken line to .npmrc, so drop it
      # when there is no token rather than sending setup-node's placeholder token.
      - name: Publish
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            unset NODE_AUTH_TOKEN
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          tag=latest
          case "$TAG" in
            *-*) tag=next ;;
          esac
          npm publish --access public --provenance --tag "$tag" "$TARBALL"
